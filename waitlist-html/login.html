<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>登录 · 法绎</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="./css/auth-dual-panel.css" rel="stylesheet">
    <script src="./js/admin-permission.js"></script>
    <script src="./js/auth.js"></script>
</head>
<body class="auth-dual auth-dual--login">

<div class="auth-dual-bg" aria-hidden="true"><div class="auth-dual-bg-photo"></div></div>

<div class="auth-dual-shell">
    <div class="auth-dual-cluster">
        <aside class="auth-intro-card" aria-label="平台介绍">
            <p class="auth-intro-watermark" aria-hidden="true">Legal</p>
            <div class="auth-intro-top">
                <div class="auth-intro-brand">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-hidden="true">
                        <path fill="#7A8CA3" d="M16.975 3.036c6.402.475 11.514 5.586 11.99 11.989H24.32a7.345 7.345 0 0 1-7.345-7.345V3.036Zm-1.95 21.284v4.644c-6.402-.475-11.514-5.587-11.989-11.99H7.68a7.345 7.345 0 0 1 7.345 7.346Z"/>
                        <path fill="#556B86" d="M3.036 15.025c.475-6.403 5.587-11.514 11.99-11.99V7.68a7.345 7.345 0 0 1-7.346 7.345H3.036Zm21.284 1.95h4.644c-.475 6.402-5.586 11.514-11.989 11.989V24.32a7.345 7.345 0 0 1 7.345-7.345Z"/>
                    </svg>
                    <span>法绎</span>
                </div>
                <span class="auth-intro-tag">用户登录</span>
            </div>
            <div class="auth-intro-body">
                <div class="auth-intro-panel">
                    <h2 class="auth-intro-title">智能法律<br>服务平台</h2>
                    <p class="auth-intro-lead">登录后继续您的咨询与检索。</p>
                </div>
                <ul class="auth-intro-points" aria-label="平台能力">
                    <li>
                        <span class="auth-intro-point-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                        多轮案情梳理
                    </li>
                    <li>
                        <span class="auth-intro-point-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                        法条快速检索
                    </li>
                    <li>
                        <span class="auth-intro-point-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
                        账号安全隔离
                    </li>
                </ul>
            </div>
            <a href="welcome.html" class="auth-intro-back">← 返回欢迎页</a>
        </aside>

        <section class="auth-form-card">
            <div class="auth-form-card-head">
                <h1>欢迎回来</h1>
                <p>登录您的法绎账号，继续使用平台服务</p>
            </div>
            <div class="auth-form-card-body">
                <div class="auth-info-strip" aria-label="平台能力">
                    <div class="auth-info-chip">
                        <span class="auth-info-chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                        <span class="auth-info-chip-text"><strong>智能咨询</strong>多轮案情梳理</span>
                    </div>
                    <div class="auth-info-chip">
                        <span class="auth-info-chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                        <span class="auth-info-chip-text"><strong>法规文书</strong>检索与起草辅助</span>
                    </div>
                    <div class="auth-info-chip">
                        <span class="auth-info-chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
                        <span class="auth-info-chip-text"><strong>安全合规</strong>权限与数据隔离</span>
                    </div>
                </div>

                <div class="auth-alert auth-alert--success hidden" id="login-success">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    注册成功，请使用刚才的邮箱与密码登录。
                </div>
                <div class="auth-alert auth-alert--error" id="login-error" role="alert"></div>

                <form id="login-form" novalidate>
                    <div class="auth-field">
                        <label class="auth-label" for="login-email">邮箱</label>
                        <div class="auth-input-wrap">
                            <span class="auth-input-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            </span>
                            <input id="login-email" class="auth-input" type="email" autocomplete="username" placeholder="请输入您的邮箱"/>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label" for="login-password">密码</label>
                        <div class="auth-input-wrap">
                            <span class="auth-input-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </span>
                            <input id="login-password" class="auth-input" type="password" autocomplete="current-password" placeholder="请输入密码"/>
                            <span class="auth-input-eye" id="eye-pw" title="显示/隐藏密码" role="button" tabindex="0">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </span>
                        </div>
                    </div>
                    <div class="auth-admin-code-wrap" id="lg-admin-code-wrap" aria-hidden="true">
                        <div class="auth-field">
                            <label class="auth-label" for="login-admin-permission-code">管理员权限验证码</label>
                            <div class="auth-input-wrap">
                                <span class="auth-input-icon">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                </span>
                                <input id="login-admin-permission-code" class="auth-input" type="text" placeholder="请输入管理员权限验证码" autocomplete="off" spellcheck="false"/>
                            </div>
                        </div>
                    </div>
                    <div class="auth-remember">
                        <label><input type="checkbox" id="remember-me"/> 记住我</label>
                        <a href="#" id="forgot-link">忘记密码？</a>
                    </div>
                    <button type="submit" class="auth-btn" id="lg-submit-btn">
                        <span id="lg-btn-text">登录</span>
                    </button>
                </form>
                <div class="auth-social-compact">
                    <button type="button" id="btn-qq-login">QQ 登录</button>
                    <button type="button" id="btn-wechat-login">微信登录</button>
                </div>
                <p class="auth-form-note">平台内容仅供参考，不构成正式法律意见；重大事项请咨询执业律师。</p>
            </div>
            <div class="auth-form-card-foot">
                <p class="auth-foot">
                    还没有账号？<a href="register.html">立即注册</a>
                    <span style="margin:0 8px;color:#cbd5e1">|</span>
                    <a href="admin-login.html">管理端登录</a> · <a href="admin/dashboard.html">运营中心</a> · <a href="welcome.html">欢迎页</a>
                </p>
            </div>
        </section>
    </div><!-- .auth-dual-cluster -->
</div>

<div class="auth-modal-overlay" id="forgot-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="auth-modal">
        <div class="auth-modal-head">
            <h2>找回密码</h2>
            <button type="button" class="auth-modal-close" id="forgot-close" aria-label="关闭">&times;</button>
        </div>
        <div class="auth-modal-body">
            <p>请输入注册邮箱，我们将发送重置说明（功能建设中）</p>
            <input type="email" class="auth-input" style="margin-top:12px;padding-left:16px;" placeholder="请输入您的邮箱"/>
        </div>
        <div class="auth-modal-foot">
            <button type="button" class="auth-modal-btn auth-modal-btn--primary" id="forgot-submit">发送重置邮件</button>
        </div>
    </div>
</div>

<script src="./js/config/system.js"></script>
<script src="./js/main.js"></script>
<script>
(function () {
    var successBar = document.getElementById('login-success');
    if (successBar && new URLSearchParams(location.search).get('registered') === '1') {
        successBar.classList.remove('hidden');
        successBar.classList.add('is-show');
    }
    var eyeBtn = document.getElementById('eye-pw');
    var pwInp = document.getElementById('login-password');
    if (eyeBtn && pwInp) eyeBtn.addEventListener('click', function () { pwInp.type = pwInp.type === 'password' ? 'text' : 'password'; });
    var errBar = document.getElementById('login-error');
    function showErr(msg) { if (errBar) { errBar.textContent = msg; errBar.classList.add('is-show'); } }
    function hideErr() { if (errBar) { errBar.classList.remove('is-show'); errBar.textContent = ''; } }
    var modal = document.getElementById('forgot-modal');
    var forgotLink = document.getElementById('forgot-link');
    if (forgotLink && modal) {
        forgotLink.addEventListener('click', function (e) { e.preventDefault(); modal.classList.add('is-open'); });
        function closeModal() { modal.classList.remove('is-open'); }
        document.getElementById('forgot-close').addEventListener('click', closeModal);
        document.getElementById('forgot-submit').addEventListener('click', function () { closeModal(); if (window.FayiToast) FayiToast('功能建设中', 'success'); });
        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    }
    document.getElementById('btn-wechat-login')?.addEventListener('click', function () { if (window.FayiToast) FayiToast('微信登录功能建设中', 'success'); });
    (function handleQqCallback() {
        var p = new URLSearchParams(location.search);
        if (!p.get('qq_token')) return;
        localStorage.setItem('fayi_user_token', p.get('qq_token'));
        localStorage.setItem('fayi_current_user', JSON.stringify({ email: p.get('qq_email') || '', name: p.get('qq_name') || 'QQ用户', avatar: p.get('qq_avatar') || './images/avatars/1.svg', persona: 'life_consume' }));
        setTimeout(function () { window.location.replace('chat.html'); }, 800);
    })();
    document.getElementById('btn-qq-login')?.addEventListener('click', function () { window.location.href = 'http://localhost:8081/api/auth/qq/login'; });
    var form = document.getElementById('login-form');
    var submitBtn = document.getElementById('lg-submit-btn');
    var btnText = document.getElementById('lg-btn-text');
    if (!form) return;
    form.addEventListener('submit', function (e) {
        var email = document.getElementById('login-email').value.trim();
        var pw = document.getElementById('login-password').value;
        if (!email || !pw) { e.preventDefault(); e.stopImmediatePropagation(); showErr('请填写邮箱和密码'); return; }
        hideErr();
        if (submitBtn) submitBtn.disabled = true;
        if (btnText) btnText.textContent = '登录中...';
        var spinner = document.createElement('div');
        spinner.className = 'auth-spinner';
        submitBtn.appendChild(spinner);
        setTimeout(function () {
            if (submitBtn && submitBtn.disabled) {
                submitBtn.disabled = false;
                if (btnText) btnText.textContent = '登录';
                var s = submitBtn.querySelector('.auth-spinner');
                if (s) s.remove();
            }
        }, 5000);
    }, true);
})();
</script>
</body>
</html>
