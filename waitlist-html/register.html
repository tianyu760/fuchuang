<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>创建账号 · 法绎</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="./css/auth-dual-panel.css" rel="stylesheet">
    <script src="./js/admin-permission.js"></script>
    <script src="./js/auth.js"></script>
</head>
<body class="auth-dual auth-dual--register">

<div class="auth-dual-bg" aria-hidden="true"><div class="auth-dual-bg-photo"></div></div>

<div class="auth-dual-shell">
    <div class="auth-dual-cluster">
        <aside class="auth-intro-card" aria-label="平台介绍">
            <p class="auth-intro-watermark" aria-hidden="true">Legal</p>
            <div class="auth-intro-top">
                <div class="auth-intro-brand">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-hidden="true">
                        <path fill="#7A8CA3" d="M16.975 3.036c6.402.475 11.514 5.586 11.99 11.989H24.32a7.345 7.345 0 0 1-7.345-7.345V3.036Zm-1.95 21.284v4.644c-6.402-.475-11.514-5.587-11.989-11.99H7.68a7.345 7.345 0 0 1 7.345 7.346Z"/>
                        <path fill="#556B86" d="M3.036 15.025c.475-6.403 5.587-11.514 11.99-11.99V7.68a7.345 7.345 0 0 1-7.346 7.345H3.036Zm21.284 1.95h4.644c-.475 6.402-5.586 11.514-11.989 11.989V24.32a7.345 7.345 0 0 1 7.345-7.345Z"/>
                    </svg>
                    <span>法绎</span>
                </div>
                <span class="auth-intro-tag">注册开通</span>
            </div>
            <div class="auth-intro-body">
                <div class="auth-intro-panel">
                    <h2 class="auth-intro-title">加入法绎<br>开启法律服务之旅</h2>
                    <p class="auth-intro-lead">一次注册，畅享智能法律服务。</p>
                </div>
                <ul class="auth-intro-points" aria-label="平台服务">
                    <li>
                        <span class="auth-intro-point-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                        智能法律咨询
                    </li>
                    <li>
                        <span class="auth-intro-point-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                        法规条文检索
                    </li>
                    <li>
                        <span class="auth-intro-point-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                        文书起草辅助
                    </li>
                </ul>
            </div>
            <a href="welcome.html" class="auth-intro-back">← 返回欢迎页</a>
        </aside>

        <section class="auth-form-card">
            <div class="auth-form-card-head">
                <h1>创建账号</h1>
                <p>填写以下信息完成注册</p>
            </div>
            <div class="auth-form-card-body">
                <div class="auth-info-strip" aria-label="注册说明">
                    <div class="auth-info-chip">
                        <span class="auth-info-chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
                        <span class="auth-info-chip-text"><strong>双角色</strong>用户与管理员</span>
                    </div>
                    <div class="auth-info-chip">
                        <span class="auth-info-chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <span class="auth-info-chip-text"><strong>安全注册</strong>密码强度校验</span>
                    </div>
                    <div class="auth-info-chip">
                        <span class="auth-info-chip-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
                        <span class="auth-info-chip-text"><strong>隐私保护</strong>协议合规</span>
                    </div>
                </div>

                <div class="auth-alert auth-alert--error hidden" id="register-error" role="alert"></div>

                <form id="register-form" novalidate>
                    <div class="auth-row-2">
                        <div class="auth-field">
                            <label class="auth-label" for="register-name">昵称</label>
                            <div class="auth-input-wrap">
                                <span class="auth-input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                                <input id="register-name" class="auth-input" type="text" placeholder="如何称呼您" autocomplete="nickname" maxlength="20"/>
                            </div>
                            <div class="auth-field-msg" id="msg-name"></div>
                        </div>
                        <div class="auth-field">
                            <label class="auth-label" for="register-email">邮箱</label>
                            <div class="auth-input-wrap">
                                <span class="auth-input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
                                <input id="register-email" class="auth-input" type="email" placeholder="example@email.com" autocomplete="email"/>
                            </div>
                            <div class="auth-field-msg" id="msg-email"></div>
                        </div>
                    </div>
                    <div class="auth-row-2">
                        <div class="auth-field">
                            <label class="auth-label" for="register-password">密码</label>
                            <div class="auth-input-wrap">
                                <span class="auth-input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                                <input id="register-password" class="auth-input" type="password" placeholder="至少 6 位" autocomplete="new-password"/>
                                <span class="auth-input-eye" id="eye-pw1" role="button" tabindex="0" title="显示/隐藏">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </span>
                            </div>
                            <div class="pw-strength-bar" id="pw-strength-bar"><span></span><span></span><span></span></div>
                        </div>
                        <div class="auth-field">
                            <label class="auth-label" for="register-password2">确认密码</label>
                            <div class="auth-input-wrap">
                                <span class="auth-input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                                <input id="register-password2" class="auth-input" type="password" placeholder="再次输入" autocomplete="new-password"/>
                                <span class="auth-input-eye" id="eye-pw2" role="button" tabindex="0" title="显示/隐藏">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </span>
                            </div>
                            <div class="auth-field-msg" id="msg-pw2"></div>
                        </div>
                    </div>
                    <div class="auth-field">
                        <div class="auth-label">选择头像</div>
                        <div class="auth-avatar-grid" id="avatar-presets">
                            <label><input type="radio" name="register-avatar" value="./images/avatars/1.svg" class="sr-only" checked/><img src="./images/avatars/1.svg" width="36" height="36" alt="1"/></label>
                            <label><input type="radio" name="register-avatar" value="./images/avatars/2.svg" class="sr-only"/><img src="./images/avatars/2.svg" width="36" height="36" alt="2"/></label>
                            <label><input type="radio" name="register-avatar" value="./images/avatars/3.svg" class="sr-only"/><img src="./images/avatars/3.svg" width="36" height="36" alt="3"/></label>
                            <label><input type="radio" name="register-avatar" value="./images/avatars/4.svg" class="sr-only"/><img src="./images/avatars/4.svg" width="36" height="36" alt="4"/></label>
                            <label><input type="radio" name="register-avatar" value="./images/avatars/5.svg" class="sr-only"/><img src="./images/avatars/5.svg" width="36" height="36" alt="5"/></label>
                            <label><input type="radio" name="register-avatar" value="./images/avatars/6.svg" class="sr-only"/><img src="./images/avatars/6.svg" width="36" height="36" alt="6"/></label>
                        </div>
                        <label class="auth-upload-link" for="register-avatar-file">上传自定义头像</label>
                        <input type="file" id="register-avatar-file" accept="image/jpeg,image/png" class="sr-only"/>
                    </div>
                    <div class="auth-field">
                        <div class="auth-label">人员类型</div>
                        <div class="auth-hint-block auth-hint-block--accent" id="rg-type-hint">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                            <span>默认注册为系统用户；选择管理员需填写权限验证码，通过后可登录管理端。</span>
                        </div>
                        <div class="auth-type-grid">
                            <label class="auth-type-card is-active" data-type="user">
                                <input type="radio" name="register-user-type" value="user" class="sr-only" checked/>
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <span class="auth-type-title">系统用户</span>
                            </label>
                            <label class="auth-type-card" data-type="admin">
                                <input type="radio" name="register-user-type" value="admin" class="sr-only"/>
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                <span class="auth-type-title">系统管理员</span>
                            </label>
                        </div>
                    </div>
                    <div class="auth-admin-code-wrap" id="rg-admin-code-wrap" aria-hidden="true">
                        <div class="auth-field">
                            <label class="auth-label" for="register-admin-permission-code">管理员权限验证码</label>
                            <div class="auth-input-wrap">
                                <span class="auth-input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
                                <input id="register-admin-permission-code" class="auth-input" type="text" placeholder="请输入验证码" autocomplete="off" spellcheck="false"/>
                            </div>
                            <div class="auth-field-msg" id="msg-admin-code"></div>
                        </div>
                    </div>
                    <div class="auth-agree">
                        <input type="checkbox" id="rg-agree-cb"/>
                        <div>我已阅读并同意
                            <button type="button" class="auth-link-btn" id="rg-open-terms">《用户协议》</button>与
                            <button type="button" class="auth-link-btn" id="rg-open-privacy">《隐私政策》</button>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn" id="rg-submit-btn"><span id="rg-btn-text">创建账号</span></button>
                </form>
            </div>
            <div class="auth-form-card-foot">
                <p class="auth-foot">已有账号？<a href="login.html">立即登录</a> · <a href="welcome.html">返回欢迎页</a></p>
            </div>
        </section>
    </div><!-- .auth-dual-cluster -->
</div>

<div class="auth-modal-overlay" id="rg-modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="rg-modal-title">
    <div class="auth-modal" role="document">
        <div class="auth-modal-head">
            <h2 id="rg-modal-title">法绎平台用户协议</h2>
            <button type="button" class="auth-modal-close" id="rg-modal-close" aria-label="关闭">&times;</button>
        </div>
        <div class="auth-modal-body" id="rg-modal-body"></div>
        <div class="auth-modal-foot">
            <button type="button" class="auth-modal-btn auth-modal-btn--ghost" id="rg-modal-dismiss">关闭</button>
            <button type="button" class="auth-modal-btn auth-modal-btn--primary" id="rg-modal-confirm">我已阅读并同意</button>
        </div>
    </div>
</div>

<script src="./js/config/system.js"></script>
<script src="./js/main.js"></script>
<script src="./js/register-page.js"></script>
</body>
</html>
