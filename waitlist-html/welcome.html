<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>欢迎 · 法绎</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="法绎智能法律服务平台">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="./css/welcome-page.css" rel="stylesheet">
</head>
<body class="welcome-page">

<div class="welcome-bg" aria-hidden="true">
    <div class="welcome-bg__gradient"></div>
    <img
        class="welcome-bg-img"
        src="./assets/images/welcome-bg-justice.png"
        alt=""
        decoding="async"
        onerror="this.onerror=null;this.src='./assets/images/auth-bg-photo.png';"
    >
</div>
<div class="welcome-overlay" aria-hidden="true"></div>

<!-- 轻量白蓝动态氛围（不改变主体布局） -->
<div class="welcome-fx" aria-hidden="true">
    <div class="welcome-fx__glow welcome-fx__glow--a"></div>
    <div class="welcome-fx__glow welcome-fx__glow--b"></div>
    <div class="welcome-fx__edge welcome-fx__edge--left"></div>
    <div class="welcome-fx__edge welcome-fx__edge--right"></div>
    <div class="welcome-fx__scan"></div>
    <div class="welcome-fx__scales"></div>
</div>

<main class="welcome-hero">
    <div class="welcome-hero-inner">
        <p class="welcome-deco welcome-reveal" aria-hidden="true">Legal</p>

        <h1 class="welcome-title welcome-reveal welcome-logo-glow">法绎</h1>

        <div class="welcome-taglines">
            <p class="welcome-tagline-main welcome-reveal">让法律知识走进每个人的生活</p>
            <p class="welcome-tagline-sub welcome-reveal">科技赋能，法律可见</p>
        </div>

        <div class="welcome-actions welcome-reveal-block">
            <a href="register.html" class="welcome-cta" id="welcome-register-btn">进入注册界面 →</a>
        </div>
    </div>
</main>

<!-- 中间偏下：粒子区 + 两个抠图玩偶 -->
<div class="welcome-mascot-zone" id="welcome-mascot-stage" aria-hidden="true">
    <canvas class="welcome-mascot-zone__canvas" id="welcome-mascot-particles"></canvas>
    <div class="welcome-mascot-slot welcome-mascot-slot--bl">
        <div class="welcome-mascot__body">
            <img
                class="welcome-mascot__img"
                src="./assets/images/welcome-mascot-2-cutout.png?v=4"
                alt=""
                width="300"
                height="300"
                decoding="async"
            >
        </div>
    </div>
    <div class="welcome-mascot-slot welcome-mascot-slot--tr">
        <div class="welcome-mascot__body">
            <img
                class="welcome-mascot__img"
                src="./assets/images/welcome-mascot-1-cutout.png?v=4"
                alt=""
                width="320"
                height="320"
                decoding="async"
            >
        </div>
    </div>
</div>

<script src="./js/welcome-page.js"></script>
</body>
</html>
