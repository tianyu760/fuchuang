server.port=8081

# Servlet 统一 UTF-8（请求/响应）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# 禁止 Whitelabel HTML 错误页，由 @RestControllerAdvice 返回 JSON
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# 文件上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# 内存阁值：超过则写磁盘，避免内存溢出
spring.servlet.multipart.file-size-threshold=2MB

# H2 持久化（重启不丢失数据）
spring.datasource.url=jdbc:h2:file:./data/fayidb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 切换到 MySQL 时取消注释并配置（utf8mb4 + utf8mb4_general_ci）
# spring.datasource.url=jdbc:mysql://localhost:3306/fayi?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
# spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
# spring.jpa.properties.hibernate.connection.useUnicode=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 控制台（开发用，可访问 http://localhost:8080/h2-console）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

